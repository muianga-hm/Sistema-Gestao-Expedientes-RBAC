<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestão de Utilizadores</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f8;
        }

        h1 {
            color: #333;
        }

        .botao {
            display: inline-block;
            padding: 10px 16px;
            background-color: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #343a40;
            color: white;
        }

        .vazio {
            text-align: center;
            padding: 20px;
        }

        .editar {
            background-color: #ffc107;
            color: #000;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 5px;
        }

        .excluir {
            background-color: #dc3545;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
        }

        .editar:hover {
            background-color: #e0a800;
        }

        .excluir:hover {
            background-color: #bb2d3b;
        }
    </style>
</head>

<body>

    <h1>Gestão de Utilizadores</h1>

    <a href="/usuarios/novo" class="botao">
        + Novo Utilizador
    </a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Papel</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td>
                <td th:text="${usuario.nome}"></td>
                <td th:text="${usuario.email}"></td>
                <td th:text="${usuario.papel}"></td>

                <td>
                    <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                       class="editar">
                        Editar
                    </a>

                    <a th:href="@{/usuarios/excluir/{id}(id=${usuario.id})}"
                       class="excluir"
                       onclick="return confirm('Tem certeza que deseja excluir este utilizador?');">
                        Excluir
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="5" class="vazio">
                    Nenhum utilizador cadastrado.
                </td>
            </tr>

        </tbody>
    </table>

</body>
</html>
