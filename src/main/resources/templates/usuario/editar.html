<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Utilizador</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f8;
        }

        .formulario {
            background-color: white;
            max-width: 500px;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .voltar {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="formulario">

    <h1>Editar Utilizador</h1>

    <form action="/usuarios/salvar" method="post">

        <input type="hidden" name="id" th:value="${usuario.id}">

        <label for="nome">Nome:</label>
        <input type="text"
               id="nome"
               name="nome"
               th:value="${usuario.nome}"
               required>

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               name="email"
               th:value="${usuario.email}"
               required>

        <label for="senha">Senha:</label>
        <input type="password"
               id="senha"
               name="senha"
               th:value="${usuario.senha}"
               required>

        <label for="papel">Papel:</label>
        <select id="papel" name="papel" required>

            <option value="ADMIN"
                    th:selected="${usuario.papel == 'ADMIN'}">
                Administrador
            </option>

            <option value="FUNCIONARIO"
                    th:selected="${usuario.papel == 'FUNCIONARIO'}">
                Funcionário
            </option>

            <option value="GESTOR"
                    th:selected="${usuario.papel == 'GESTOR'}">
                Gestor
            </option>

        </select>

        <button type="submit">
            Atualizar Utilizador
        </button>

    </form>

    <a href="/usuarios" class="voltar">
        ← Voltar para utilizadores
    </a>

</div>

</body>
</html>
