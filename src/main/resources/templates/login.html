<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão de Expedientes</title>

```
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f4f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .login-container {
        background: white;
        width: 350px;
        padding: 35px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
        text-align: center;
        color: #1f4e79;
        margin-bottom: 10px;
    }

    p {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 25px;
        border: none;
        border-radius: 5px;
        background: #1f4e79;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #163a5c;
    }
</style>
```

</head>

<body>

<div class="login-container">

```
<h1>Gestão de Expedientes</h1>

<p>Faça login para entrar no sistema</p>

<form action="/login" method="post">

    <label for="username">Utilizador</label>
    <input type="text" id="username" name="username"
           placeholder="Digite o utilizador" required>

    <label for="password">Senha</label>
    <input type="password" id="password" name="password"
           placeholder="Digite a senha" required>

    <button type="submit">Entrar</button>

</form>
```

</div>

</body>
</html>
