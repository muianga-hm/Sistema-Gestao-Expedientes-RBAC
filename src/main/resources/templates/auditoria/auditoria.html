<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Auditoria do Sistema</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f8;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #343a40;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .botoes {
            margin-top: 25px;
        }

        .botao {
            display: inline-block;
            padding: 10px 18px;
            margin-right: 10px;
            text-decoration: none;
            color: white;
            background-color: #6c757d;
            border-radius: 5px;
        }

        .botao:hover {
            opacity: 0.9;
        }

        .vazio {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Auditoria do Sistema</h1>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Utilizador</th>
                <th>Data e Hora</th>
                <th>Ação</th>
                <th>Descrição</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="auditoria : ${auditorias}">

                <td th:text="${auditoria.id}"></td>

                <td th:text="${auditoria.utilizador}"></td>

                <td th:text="${#temporals.format(auditoria.dataHora, 'dd/MM/yyyy HH:mm')}"></td>

                <td th:text="${auditoria.acao}"></td>

                <td th:text="${auditoria.descricao}"></td>

            </tr>

            <tr th:if="${#lists.isEmpty(auditorias)}">
                <td colspan="5" class="vazio">
                    Nenhum registo de auditoria encontrado.
                </td>
            </tr>

        </tbody>

    </table>

    <div class="botoes">

        <a href="/expedientes" class="botao">
            Gestão de Expedientes
        </a>

        <a href="/" class="botao">
            Voltar ao Menu
        </a>

    </div>

</div>

</body>
</html>
