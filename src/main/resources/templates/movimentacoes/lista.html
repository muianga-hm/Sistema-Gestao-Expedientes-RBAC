<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Movimentações</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        .info {
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f0f0f0;
        }

        .botoes {
            margin-top: 25px;
        }

        .botao {
            display: inline-block;
            padding: 10px 18px;
            margin-right: 10px;
            text-decoration: none;
            border-radius: 4px;
            color: white;
        }

        .novo {
            background-color: #198754;
        }

        .voltar {
            background-color: #6c757d;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Histórico de Movimentações</h1>

    <div class="info">
        <p>
            <strong>Número do Expediente:</strong>
            <span th:text="${expediente.numero}"></span>
        </p>

        <p>
            <strong>Assunto:</strong>
            <span th:text="${expediente.assunto}"></span>
        </p>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Remetente</th>
            <th>Destinatário</th>
            <th>Data</th>
            <th>Estado</th>
            <th>Observação / Despacho</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="mov : ${movimentacoes}">

            <td th:text="${mov.id}"></td>

            <td th:text="${mov.remetente}"></td>

            <td th:text="${mov.destinatario}"></td>

            <td th:text="${#temporals.format(mov.dataMovimentacao, 'dd/MM/yyyy HH:mm')}"></td>

            <td th:text="${mov.estado}"></td>

            <td th:text="${mov.observacao}"></td>

        </tr>

        <tr th:if="${#lists.isEmpty(movimentacoes)}">
            <td colspan="6">
                Nenhuma movimentação registada para este expediente.
            </td>
        </tr>

        </tbody>
    </table>

    <div class="botoes">

        <a class="botao novo"
           th:href="@{/movimentacoes/novo/{id}(id=${expediente.id})}">
            + Nova Movimentação
        </a>

        <a class="botao voltar"
           th:href="@{/expedientes}">
            Voltar aos Expedientes
        </a>

    </div>

</div>

</body>
</html>
